bashToolPatterns:
  - pattern: '\brm\s+(-[^\s]*)*-[rRf]'
    reason: rm with recursive or force flags
  - pattern: '\bgit\s+reset\s+--hard\b'
    reason: destructive git reset
  - pattern: '\bgit\s+clean\s+(-[^\s]*)*-[fd]'
    reason: destructive git clean
  - pattern: '\bgit\s+push\s+.*--force(?!-with-lease)'
    reason: unsafe force push
  - pattern: '\bchmod\s+(-[^\s]+\s+)*777\b'
    reason: world-writable permissions
  - pattern: '\bsudo\b'
    reason: privileged command

zeroAccessPaths:
  - ".env"
  - ".env.local"
  - ".env.*.local"
  - "*.pem"
  - "*.key"
  - "*-credentials.json"
  - ".vercel/"
  - ".netlify/"
  - "~/.ssh/"
  - "~/.aws/"

readOnlyPaths:
  - ".git/"
  - "node_modules/"
  - ".next/"
  - "build/"
  - "coverage/"
  - "package-lock.json"
  - "bun.lock"
  - ".wolf/"
